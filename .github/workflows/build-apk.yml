name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source and asset
        run: |
          test -f app/src/main/java/com/example/iptvplayer/MainActivity.kt
          test -f app/src/main/res/drawable-nodpi/home_movies_icon.png
          grep -q 'R.drawable.home_movies_icon' app/src/main/java/com/example/iptvplayer/MainActivity.kt
          grep -q 'listOf("movies" to "Фильмы", "channels" to "ТВ", "favorites" to "Избранное")' app/src/main/java/com/example/iptvplayer/MainActivity.kt

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
