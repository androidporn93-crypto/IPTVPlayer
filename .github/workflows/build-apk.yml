name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply exact reference UI
        run: python3 scripts/apply_reference_ui.py

      - name: Fix Compose compile issues
        run: python3 scripts/fix_compile.py

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify requested UI resources
        run: |
          test -f app/src/main/res/drawable-nodpi/hero_tv.png
          test -f app/src/main/res/drawable-nodpi/iptv_channels_photo.webp
          test -f app/src/main/res/drawable-nodpi/movies_photo.webp
          grep -q 'Scaffold(containerColor = BG) { padding ->' app/src/main/java/com/example/iptvplayer/MainActivity.kt
          grep -q 'R.drawable.hero_tv' app/src/main/java/com/example/iptvplayer/MainActivity.kt
          ! grep -q 'bottomBar = { BottomBar' app/src/main/java/com/example/iptvplayer/MainActivity.kt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-final
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
