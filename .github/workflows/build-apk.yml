name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/example/iptvplayer/MainActivity.kt')
          s = p.read_text()

          # Fix the old Triple-based BottomBar without relying on exact whitespace.
          s = re.sub(
              r'listOf\(\s*Triple\("home",\s*"Главная"\),\s*Triple\("channels",\s*"ТВ"\),\s*Triple\("movies",\s*"Фильмы"\),\s*Triple\("settings",\s*"Ещё"\)\s*\)',
              'listOf("home" to "Главная", "channels" to "ТВ", "movies" to "Фильмы", "settings" to "Ещё")',
              s,
              count=1,
              flags=re.S,
          )

          # Store tvg-logo from M3U and use the real logo where available.
          s = s.replace(
              'data class Channel(val name: String, val group: String, val url: String, val userAgent: String = "")',
              'data class Channel(val name: String, val group: String, val url: String, val userAgent: String = "", val logoUrl: String = "")',
              1,
          )
          s = s.replace(
              'val result = mutableListOf<Channel>(); var name = ""; var group = ""; var ua = ""',
              'val result = mutableListOf<Channel>(); var name = ""; var group = ""; var ua = ""; var logo = ""',
              1,
          )
          s = s.replace(
              'group = Regex("""group-title=\\"([^\\"]*)\\"""", RegexOption.IGNORE_CASE).find(line)?.groupValues?.getOrNull(1).orEmpty(); ua = ""',
              'group = Regex("""group-title=\\"([^\\"]*)\\"""", RegexOption.IGNORE_CASE).find(line)?.groupValues?.getOrNull(1).orEmpty(); logo = Regex("""tvg-logo=\\"([^\\"]*)\\"""", RegexOption.IGNORE_CASE).find(line)?.groupValues?.getOrNull(1).orEmpty(); ua = ""',
              1,
          )
          s = s.replace(
              'if (name.isNotBlank()) result += Channel(name, group, line, ua); name = ""; group = ""; ua = ""',
              'if (name.isNotBlank()) result += Channel(name, group, line, ua, logo); name = ""; group = ""; ua = ""; logo = ""',
              1,
          )

          # Replace the fallback channel-logo function with real tvg-logo + fallback.
          logo_start = s.find('@Composable\nprivate fun ChannelLogo(index: Int, name: String)')
          logo_end = s.find('@Composable\nprivate fun PlayerScreen', logo_start)
          if logo_start >= 0 and logo_end > logo_start:
              new_logo = '''@Composable
private fun ChannelLogo(index: Int, name: String, logoUrl: String = "") {
    Box(Modifier.size(42.dp).background(ICON_BG, RoundedCornerShape(11.dp)), Alignment.Center) {
        if (logoUrl.isNotBlank()) {
            AsyncImage(model = logoUrl, contentDescription = name, modifier = Modifier.size(34.dp))
        } else {
            val palettes = listOf(
                listOf(Color(0xFF2E6CD4), Color(0xFF203C86)), listOf(Color(0xFF18A85C), Color(0xFF0E6D42)),
                listOf(Color(0xFFE53935), Color(0xFF9E2222)), listOf(Color(0xFF4E7EA8), Color(0xFF243A5C)),
                listOf(Color(0xFF5E9AD6), Color(0xFF284465)), listOf(Color(0xFFE34B32), Color(0xFF9B271A)),
                listOf(Color(0xFFF08A22), Color(0xFF9B4E0B))
            )
            val colors = palettes[index % palettes.size]
            val short = when {
                name.contains("Крым", true) -> "24"
                name.contains("Югра", true) -> "Ю"
                name.contains("Липец", true) -> "◷"
                name.contains("4 канал", true) -> "4"
                name.length > 5 -> name.take(2).uppercase()
                else -> name.take(1).uppercase()
            }
            Box(Modifier.size(34.dp).background(Brush.linearGradient(colors), RoundedCornerShape(9.dp)), Alignment.Center) {
                Text(short, color = Color.White, fontWeight = FontWeight.ExtraBold, fontSize = if (short.length > 1) 10.sp else 14.sp)
            }
        }
    }
}

'''
              s = s[:logo_start] + new_logo + s[logo_end:]
          else:
              raise SystemExit('ChannelLogo block not found')

          # Use the same channel icon in the player list.
          s = s.replace(
              'Text("${nextIndex + 1}", color = PURPLE, fontWeight = FontWeight.Bold, modifier = Modifier.width(36.dp))',
              'ChannelLogo(nextIndex, next.name, next.logoUrl); Text("${nextIndex + 1}", color = PURPLE, fontWeight = FontWeight.Bold, modifier = Modifier.width(36.dp))',
              1,
          )
          s = s.replace(
              'ChannelLogo(item.index, item.value.name)',
              'ChannelLogo(item.index, item.value.name, item.value.logoUrl)',
              1,
          )

          # Smaller player circles + centered glyphs.
          s = s.replace(
              'Modifier.size(46.dp).background(Color.Black.copy(.78f), CircleShape)',
              'Modifier.size(38.dp).background(Color.Black.copy(.72f), CircleShape)',
              1,
          )
          s = s.replace('Canvas(Modifier.size(46.dp))', 'Canvas(Modifier.size(20.dp))', 1)
          s = s.replace(
              'Modifier.size(40.dp).background(Color.Black.copy(.65f), CircleShape)',
              'Modifier.size(36.dp).background(Color.Black.copy(.62f), CircleShape)',
              1,
          )
          s = s.replace('Canvas(Modifier.size(40.dp))', 'Canvas(Modifier.size(19.dp))', 1)

          # Standard-size bottom navigation glyphs; scale the existing drawing to the Canvas.
          s = s.replace(
              'Canvas(Modifier.size(24.dp))',
              'Canvas(Modifier.size(26.dp).graphicsLayer { scaleX = 2.6f; scaleY = 2.6f })',
              1,
          )

          # Scale the falling-person movie icon without redesigning the accepted artwork.
          s = s.replace(
              'Canvas(Modifier.fillMaxSize()) {',
              'Canvas(Modifier.fillMaxSize().graphicsLayer { scaleX = 2.2f; scaleY = 2.2f }) {',
              1,
          )

          p.write_text(s)
          print('UI/build patch applied')
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
