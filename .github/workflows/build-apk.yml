name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/iptvplayer/MainActivity.kt')
          s = p.read_text()

          def replace_block(src: str, start: str, end: str, replacement: str) -> str:
              a = src.find(start)
              if a < 0:
                  raise SystemExit(f'Start marker not found: {start}')
              b = src.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'End marker not found for: {start}')
              return src[:a] + replacement + src[b:]

          s = s.replace(
              'data class Channel(val name: String, val group: String, val url: String, val userAgent: String = "")',
              'data class Channel(val name: String, val group: String, val url: String, val userAgent: String = "", val logoUrl: String = "")',
              1,
          )

          s = replace_block(
              s,
              'private fun parseM3u',
              'private fun loadMovies',
              '''private fun parseM3u(text: String): List<Channel> {
              val result = mutableListOf<Channel>()
              var name = ""
              var group = ""
              var ua = ""
              var logo = ""
              val groupRe = Regex("""group-title\\s*=\\s*[\"']([^\"']*)[\"']""", RegexOption.IGNORE_CASE)
              val logoRe = Regex("""tvg-logo\\s*=\\s*[\"']([^\"']*)[\"']""", RegexOption.IGNORE_CASE)
              text.lineSequence().forEach { raw ->
                  val line = raw.trim()
                  when {
                      line.startsWith("#EXTINF:", true) -> {
                          name = line.substringAfterLast(',').trim()
                          group = groupRe.find(line)?.groupValues?.getOrNull(1).orEmpty()
                          logo = logoRe.find(line)?.groupValues?.getOrNull(1).orEmpty()
                          ua = ""
                      }
                      line.startsWith("#EXTVLCOPT:http-user-agent=", true) -> ua = line.substringAfter('=').trim()
                      line.startsWith("#") || line.isBlank() -> Unit
                      else -> {
                          if (name.isNotBlank()) result += Channel(name, group, line, ua, logo)
                          name = ""
                          group = ""
                          ua = ""
                          logo = ""
                      }
                  }
              }
              return result
          }
''',
          )

          s = replace_block(
              s,
              '@Composable\nprivate fun Film3D()',
              '@Composable\nprivate fun Channels',
              '''@Composable
          private fun Film3D() {
              Canvas(Modifier.fillMaxSize()) {
                  val scale = size.minDimension / 62f
                  androidx.compose.ui.graphics.drawscope.withTransform({
                      scale(scale, scale)
                  }) {
                      drawCircle(Color.Black.copy(.40f), radius = 17f, center = Offset(21f, 42f))
                      drawCircle(Color(0xFF6D7689), radius = 16f, center = Offset(20f, 40f))
                      drawCircle(Color(0xFF192231), radius = 12f, center = Offset(20f, 40f))
                      for (hole in listOf(Offset(20f, 33f), Offset(27f, 40f), Offset(20f, 47f), Offset(13f, 40f))) {
                          drawCircle(Color(0xFF8797AB), radius = 2.3f, center = hole)
                      }
                      drawRoundRect(
                          Brush.linearGradient(listOf(Color(0xFF202A38), Color(0xFF74869C))),
                          Offset(5f, 24f), Size(38f, 8f),
                          cornerRadius = androidx.compose.ui.geometry.CornerRadius(3f, 3f)
                      )
                      drawLine(Color.White.copy(.78f), Offset(10f, 25f), Offset(14f, 31f), strokeWidth = 2.3f)
                      drawLine(Color.White.copy(.78f), Offset(20f, 25f), Offset(24f, 31f), strokeWidth = 2.3f)
                      drawLine(Color.White.copy(.78f), Offset(30f, 25f), Offset(34f, 31f), strokeWidth = 2.3f)
                      drawCircle(Color(0xFFF2D0A1), radius = 5.2f, center = Offset(48f, 12f))
                      drawLine(Color(0xFFF2D0A1), Offset(46f, 17f), Offset(40f, 29f), strokeWidth = 3.8f)
                      drawLine(Color(0xFFF2D0A1), Offset(40f, 29f), Offset(31f, 24f), strokeWidth = 3.2f)
                      drawLine(Color(0xFFF2D0A1), Offset(40f, 29f), Offset(51f, 25f), strokeWidth = 3.2f)
                      drawLine(Color(0xFFF2D0A1), Offset(40f, 30f), Offset(33f, 43f), strokeWidth = 3.7f)
                      drawLine(Color(0xFFF2D0A1), Offset(41f, 30f), Offset(53f, 39f), strokeWidth = 3.7f)
                      drawCircle(Color(0xFF6D28D9).copy(.55f), radius = 3.3f, center = Offset(48f, 12f))
                  }
              }
          }
''',
          )

          s = replace_block(
              s,
              '@Composable\nprivate fun ChannelRow',
              '@Composable\nprivate fun PlayerScreen',
              '''@Composable
          private fun ChannelRow(index: Int, c: Channel, on: (Int) -> Unit) {
              Row(
                  Modifier.fillMaxWidth()
                      .background(CARD, RoundedCornerShape(14.dp))
                      .clickable { on(index) }
                      .padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  ChannelLogoView(c.logoUrl, index, c.name, 48.dp)
                  Column(Modifier.padding(start = 12.dp).weight(1f)) {
                      Text(c.name, color = Color.White, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Text(c.group.ifBlank { "ТВ канал" }, color = MUTED, fontSize = 12.sp)
                  }
                  Text("▶", color = PURPLE, fontSize = 20.sp)
              }
          }

          @Composable
          private fun ChannelLogoView(logoUrl: String, index: Int, name: String, size: Dp) {
              Box(
                  Modifier.size(size).background(ICON_BG, RoundedCornerShape(12.dp)),
                  Alignment.Center
              ) {
                  if (logoUrl.isNotBlank()) {
                      AsyncImage(
                          model = logoUrl,
                          contentDescription = name,
                          modifier = Modifier.size(39.dp)
                      )
                  } else {
                      ChannelLogoFallback(index, name)
                  }
              }
          }

          @Composable
          private fun ChannelLogoFallback(index: Int, name: String) {
              val palettes = listOf(
                  listOf(Color(0xFF2E6CD4), Color(0xFF203C86)), listOf(Color(0xFF18A85C), Color(0xFF0E6D42)),
                  listOf(Color(0xFFE53935), Color(0xFF9E2222)), listOf(Color(0xFF4E7EA8), Color(0xFF243A5C)),
                  listOf(Color(0xFF5E9AD6), Color(0xFF284465)), listOf(Color(0xFFE34B32), Color(0xFF9B271A)),
                  listOf(Color(0xFFF08A22), Color(0xFF9B4E0B))
              )
              val colors = palettes[index % palettes.size]
              val short = when {
                  name.contains("Крым", true) -> "24"
                  name.contains("Югра", true) -> "Ю"
                  name.contains("Липец", true) -> "◷"
                  name.contains("4 канал", true) -> "4"
                  name.length > 5 -> name.take(2).uppercase()
                  else -> name.take(1).uppercase()
              }
              Box(
                  Modifier.size(34.dp)
                      .background(Brush.linearGradient(colors), RoundedCornerShape(9.dp))
                      .graphicsLayer { rotationZ = if (index % 2 == 0) -3f else 3f },
                  Alignment.Center
              ) {
                  Text(short, color = Color.White, fontWeight = FontWeight.ExtraBold, fontSize = if (short.length > 1) 10.sp else 14.sp)
              }
          }
''',
          )

          s = replace_block(
              s,
              '@Composable\nprivate fun PlayerScreen',
              '@Composable\nprivate fun VideoView',
              '''@Composable
          private fun PlayerScreen(channels: List<Channel>, index: Int, onSelect: (Int) -> Unit, onBack: () -> Unit) {
              val context = LocalContext.current
              val activity = context as ComponentActivity
              val channel = channels[index]
              var fullscreen by remember { mutableStateOf(false) }
              var errorText by remember { mutableStateOf<String?>(null) }
              var isPlaying by remember { mutableStateOf(true) }
              val player = remember(channel.url, channel.userAgent) {
                  val httpFactory = DefaultHttpDataSource.Factory()
                      .setUserAgent(channel.userAgent.ifBlank { UA })
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15000)
                      .setReadTimeoutMs(20000)
                  ExoPlayer.Builder(context)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(httpFactory))
                      .build()
                      .apply {
                          playWhenReady = true
                          addListener(object : Player.Listener {
                              override fun onPlayerError(error: PlaybackException) { errorText = "Не удалось загрузить канал\\n${error.errorCodeName}" }
                              override fun onIsPlayingChanged(playing: Boolean) { isPlaying = playing }
                              override fun onPlaybackStateChanged(state: Int) { if (state == Player.STATE_READY) errorText = null }
                          })
                          setMediaItem(MediaItem.fromUri(channel.url))
                          prepare()
                      }
              }
              DisposableEffect(player) {
                  isPlaying = player.isPlaying
                  onDispose {
                      player.release()
                      activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  }
              }
              BackHandler { if (fullscreen) fullscreen = false else onBack() }
              LaunchedEffect(fullscreen) {
                  if (fullscreen) {
                      activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      WindowCompat.setDecorFitsSystemWindows(activity.window, false)
                      WindowInsetsControllerCompat(activity.window, activity.window.decorView).apply {
                          hide(WindowInsetsCompat.Type.systemBars())
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      WindowCompat.setDecorFitsSystemWindows(activity.window, true)
                      WindowInsetsControllerCompat(activity.window, activity.window.decorView).show(WindowInsetsCompat.Type.systemBars())
                  }
              }
              if (fullscreen) {
                  Box(Modifier.fillMaxSize().background(Color.Black)) {
                      VideoView(player, true, Modifier.fillMaxSize())
                      PlayerButtons(player, isPlaying, { fullscreen = false }, Modifier.align(Alignment.BottomEnd))
                      errorText?.let { ErrorMessage(it, Modifier.align(Alignment.Center)) }
                  }
              } else {
                  Column(Modifier.fillMaxSize().background(BG)) {
                      Box(Modifier.fillMaxWidth().aspectRatio(16f / 9f).background(Color.Black)) {
                          VideoView(player, false, Modifier.fillMaxSize())
                          Box(
                              Modifier.align(Alignment.TopStart)
                                  .padding(10.dp)
                                  .size(40.dp)
                                  .background(Color.Black.copy(.45f), CircleShape)
                                  .clickable { onBack() },
                              Alignment.Center
                          ) { Text("‹", color = Color.White, fontSize = 26.sp) }
                          PlayerButtons(player, isPlaying, { fullscreen = true }, Modifier.align(Alignment.BottomEnd))
                          errorText?.let { ErrorMessage(it, Modifier.align(Alignment.Center)) }
                      }
                      Text("${index + 1}. ${channel.name}", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(16.dp, 14.dp, 16.dp, 4.dp))
                      Text("Следующие каналы", color = MUTED, fontSize = 13.sp, modifier = Modifier.padding(horizontal = 16.dp))
                      LazyColumn(contentPadding = PaddingValues(12.dp, 10.dp, 12.dp, 24.dp), verticalArrangement = Arrangement.spacedBy(7.dp)) {
                          itemsIndexed(channels.drop(index + 1)) { offset, next ->
                              val nextIndex = index + 1 + offset
                              Row(
                                  Modifier.fillMaxWidth()
                                      .background(CARD, RoundedCornerShape(13.dp))
                                      .clickable { onSelect(nextIndex) }
                                      .padding(10.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  ChannelLogoView(next.logoUrl, nextIndex, next.name, 46.dp)
                                  Text("${nextIndex + 1}", color = PURPLE, fontWeight = FontWeight.Bold, modifier = Modifier.width(34.dp).padding(start = 6.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text(next.name, color = Color.White, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      Text(next.group.ifBlank { "ТВ канал" }, color = MUTED, fontSize = 11.sp)
                                  }
                                  Text("▶", color = PURPLE, fontSize = 18.sp)
                              }
                          }
                      }
                  }
              }
          }
''',
          )

          s = replace_block(
              s,
              '@Composable\nprivate fun PlayerButtons',
              '@Composable private fun ErrorMessage',
              '''@Composable
          private fun PlayerButtons(player: ExoPlayer, isPlaying: Boolean, onFullscreen: () -> Unit, modifier: Modifier) {
              Row(
                  modifier.padding(8.dp),
                  horizontalArrangement = Arrangement.spacedBy(6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier.size(38.dp)
                          .background(Color.Black.copy(.72f), CircleShape)
                          .clickable { if (player.isPlaying) player.pause() else player.play() },
                      contentAlignment = Alignment.Center
                  ) {
                      Canvas(Modifier.size(19.dp)) {
                          val w = size.width
                          val h = size.height
                          if (isPlaying) {
                              drawRoundRect(Color.White, Offset(w * .18f, h * .18f), Size(w * .24f, h * .64f), cornerRadius = androidx.compose.ui.geometry.CornerRadius(w * .08f, w * .08f))
                              drawRoundRect(Color.White, Offset(w * .58f, h * .18f), Size(w * .24f, h * .64f), cornerRadius = androidx.compose.ui.geometry.CornerRadius(w * .08f, w * .08f))
                          } else {
                              val pth = Path().apply {
                                  moveTo(w * .30f, h * .16f)
                                  lineTo(w * .30f, h * .84f)
                                  lineTo(w * .78f, h * .50f)
                                  close()
                              }
                              drawPath(pth, Color.White)
                          }
                      }
                  }
                  Box(
                      Modifier.size(36.dp)
                          .background(Color.Black.copy(.62f), CircleShape)
                          .clickable { onFullscreen() },
                      contentAlignment = Alignment.Center
                  ) {
                      Canvas(Modifier.size(18.dp)) {
                          val w = size.width
                          val h = size.height
                          val sw = maxOf(1.7f, w * .13f)
                          val left = w * .16f
                          val right = w * .84f
                          val top = h * .16f
                          val bottom = h * .84f
                          val innerX = w * .33f
                          val innerY = h * .33f
                          drawLine(Color.White, Offset(left, innerY), Offset(left, top), strokeWidth = sw)
                          drawLine(Color.White, Offset(left, top), Offset(innerX, top), strokeWidth = sw)
                          drawLine(Color.White, Offset(right, innerY), Offset(right, top), strokeWidth = sw)
                          drawLine(Color.White, Offset(right, top), Offset(w - innerX, top), strokeWidth = sw)
                          drawLine(Color.White, Offset(left, h - innerY), Offset(left, bottom), strokeWidth = sw)
                          drawLine(Color.White, Offset(left, bottom), Offset(innerX, bottom), strokeWidth = sw)
                          drawLine(Color.White, Offset(right, h - innerY), Offset(right, bottom), strokeWidth = sw)
                          drawLine(Color.White, Offset(right, bottom), Offset(w - innerX, bottom), strokeWidth = sw)
                      }
                  }
              }
          }
''',
          )

          s = replace_block(
              s,
              '@Composable\nprivate fun NavIcon',
              '@Composable\nprivate fun BottomBar',
              '''@Composable
          private fun NavIcon(id: String, selected: Boolean) {
              val tint = if (selected) Color.White else Color(0xFFC7CDD8)
              Canvas(Modifier.size(26.dp)) {
                  val w = size.width
                  val h = size.height
                  when (id) {
                      "home" -> {
                          val roof = Path().apply { moveTo(w*.14f, h*.43f); lineTo(w*.50f, h*.13f); lineTo(w*.86f, h*.43f) }
                          drawPath(roof, tint, style = Stroke(width = w*.085f))
                          drawRoundRect(tint, Offset(w*.24f, h*.40f), Size(w*.52f, h*.44f), cornerRadius = androidx.compose.ui.geometry.CornerRadius(w*.06f, w*.06f), style = Stroke(width = w*.085f))
                      }
                      "channels" -> {
                          drawRoundRect(tint, Offset(w*.10f, h*.20f), Size(w*.80f, h*.60f), cornerRadius = androidx.compose.ui.geometry.CornerRadius(w*.13f, w*.13f), style = Stroke(width = w*.085f))
                          drawLine(tint, Offset(w*.28f, h*.88f), Offset(w*.72f, h*.88f), strokeWidth = w*.08f)
                      }
                      "movies" -> {
                          drawRoundRect(tint, Offset(w*.10f, h*.20f), Size(w*.80f, h*.62f), cornerRadius = androidx.compose.ui.geometry.CornerRadius(w*.10f, w*.10f), style = Stroke(width = w*.08f))
                          drawLine(tint, Offset(w*.24f, h*.20f), Offset(w*.30f, h*.40f), strokeWidth = w*.07f)
                          drawLine(tint, Offset(w*.43f, h*.20f), Offset(w*.49f, h*.40f), strokeWidth = w*.07f)
                          drawLine(tint, Offset(w*.62f, h*.20f), Offset(w*.68f, h*.40f), strokeWidth = w*.07f)
                          val play = Path().apply { moveTo(w*.43f, h*.48f); lineTo(w*.43f, h*.72f); lineTo(w*.68f, h*.60f); close() }
                          drawPath(play, PURPLE)
                      }
                      else -> {
                          drawLine(tint, Offset(w*.18f, h*.30f), Offset(w*.82f, h*.30f), strokeWidth = w*.08f)
                          drawLine(tint, Offset(w*.18f, h*.50f), Offset(w*.82f, h*.50f), strokeWidth = w*.08f)
                          drawLine(tint, Offset(w*.18f, h*.70f), Offset(w*.82f, h*.70f), strokeWidth = w*.08f)
                      }
                  }
              }
          }
''',
          )

          s = replace_block(
              s,
              '@Composable\nprivate fun BottomBar',
              'private fun loadM3u',
              '''@Composable
          private fun BottomBar(page: String, onPage: (String) -> Unit) {
              NavigationBar(containerColor = Color(0xFF0D1117)) {
                  listOf(
                      "home" to "Главная",
                      "channels" to "ТВ",
                      "movies" to "Фильмы",
                      "settings" to "Ещё"
                  ).forEach { (id, label) ->
                      NavigationBarItem(
                          selected = page == id,
                          onClick = { onPage(id) },
                          icon = { NavIcon(id, page == id) },
                          label = { Text(label, fontSize = 10.sp) }
                      )
                  }
              }
          }

''',
          )

          p.write_text(s)
          print('UI patch applied successfully')
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

# Robust UI patch and APK rebuild.
