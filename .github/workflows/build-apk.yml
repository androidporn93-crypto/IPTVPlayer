name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare supplied card artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          import base64
          from pathlib import Path

          assets = {
              'app/src/main/assets/iptv_channels_photo.webp.b64': 'app/src/main/res/drawable-nodpi/iptv_channels_photo.webp',
              'app/src/main/assets/movies_photo.webp.b64': 'app/src/main/res/drawable-nodpi/movies_photo.webp',
          }
          for src, dst in assets.items():
              Path(dst).write_bytes(base64.b64decode(Path(src).read_text().strip()))

          source = Path('app/src/main/java/com/example/iptvplayer/MainActivity.kt')
          text = source.read_text()
          old = '''        if (kind == "movie") {
            Image(
                painter = painterResource(R.drawable.home_movies_icon),
                contentDescription = "Фильмы",
                modifier = Modifier.size(104.dp).clip(RoundedCornerShape(14.dp))
            )
        } else {
            ThreeDHomeIcon(kind, Modifier.size(94.dp))
        }'''
          new = '''        if (kind == "movie") {
            Image(
                painter = painterResource(R.drawable.movies_photo),
                contentDescription = "Фильмы",
                modifier = Modifier.size(104.dp).clip(RoundedCornerShape(14.dp))
            )
        } else {
            Image(
                painter = painterResource(R.drawable.iptv_channels_photo),
                contentDescription = "ТВ каналы",
                modifier = Modifier.size(104.dp).clip(RoundedCornerShape(14.dp))
            )
        }'''
          if old not in text:
              raise SystemExit('HomeBtn block not found; source layout changed')
          source.write_text(text.replace(old, new, 1))
          PY
          rm -f app/src/main/assets/iptv_channels_photo.webp.b64 app/src/main/assets/movies_photo.webp.b64

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
